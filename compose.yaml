name: lingvogameos-asp-template

services:
  game:
    build:
      context: .
    init: true
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Standalone Compose serves the game from /. The portal stack overrides
      # this with /games/<slug> and keeps the container port internal.
      GAME_PATH_BASE: ""
    ports:
      - "${GAME_HOST_PORT:-8080}:8080"
    volumes:
      - data-protection:/home/app/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  data-protection:
